<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits</title>
<style>
  :root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--accent:#2f9e6b;--today:#fff6d6;--danger:#d64545}
  @media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--text:#ececef;--muted:#9a9aa1;--line:#2e2e33;--accent:#3fbf86;--today:#3a3420;--danger:#ff6b6b}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:12px;padding:16px;max-width:960px;margin:0 auto}
  h1{font-size:20px;margin:0;flex:1}
  main{max-width:960px;margin:0 auto;padding:0 16px 40px}
  button,input{font:inherit;color:inherit}
  button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  .status{font-size:13px;color:var(--muted);border:none;background:none;padding:4px}
  .status.ok{color:var(--accent)} .status.err{color:var(--danger)}
  #addForm{display:flex;gap:8px;margin-bottom:16px}
  #addForm input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  #range{flex:1;text-align:center;font-weight:600}
  .grid-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%}
  th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  th{font-size:12px;font-weight:500;color:var(--muted)}
  th .dnum{display:block;font-size:14px;color:var(--text);font-weight:600}
  .name{text-align:left;padding-left:12px;position:sticky;left:0;background:var(--card);min-width:140px;max-width:220px;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.name{cursor:pointer}
  .today{background:var(--today)}
  .cell{width:30px;height:30px;padding:0;border-radius:8px;border:1px solid var(--line);background:transparent}
  .cell.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .streak{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 8px}
  .del{border:none;background:none;color:var(--muted);font-size:18px;padding:4px 8px}
  .del:hover{color:var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:24px}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);max-width:420px;width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h2{margin:0 0 8px;font-size:18px}
  dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0}
  dialog input{display:block;width:100%;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .hint{font-size:12px;color:var(--muted)}
  .row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>Habits</h1>
  <button id="status" class="status" title="Click to re-sync">…</button>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <form id="addForm">
    <input id="habitName" placeholder="New habit, e.g. Read 20 min" maxlength="60" required>
    <button class="primary">Add</button>
  </form>

  <div class="nav">
    <button id="prev">‹ Prev</button>
    <span id="range"></span>
    <button id="next">Next ›</button>
    <button id="todayBtn">Today</button>
  </div>

  <div class="grid-wrap" id="gridWrap"><table id="grid"></table></div>
  <p id="empty" class="empty" hidden>No habits yet. Add one above.</p>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>GitHub sync</h2>
    <label>Owner (your GitHub username)<input name="owner" required></label>
    <label>Repository name<input name="repo" required></label>
    <label>Data branch<input name="branch" value="data" required></label>
    <label>File path<input name="path" value="data.json" required></label>
    <label>Personal access token<input name="token" type="password" autocomplete="off" required></label>
    <p class="hint">The token is stored only in this browser. Data is saved to a separate branch so your site doesn't rebuild on every click.</p>
    <div class="row">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="save" class="primary">Save &amp; sync</button>
    </div>
  </form>
</dialog>

<script>
const CFG_KEY = 'habit-cfg', CACHE_KEY = 'habit-cache', PENDING_KEY = 'habit-pending';
const $ = id => document.getElementById(id);

// ---------- local storage helpers ----------
const load  = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const isPending  = () => load(PENDING_KEY) === true;
const setPending = v => store(PENDING_KEY, v);

let cfg = load(CFG_KEY) || {};
let state = normalize(load(CACHE_KEY));
let sha = null, remoteReady = false, saving = false, dirty = false, saveTimer = null;
let endOffset = 0; // days between today and the last column shown

function normalize(s) {
  s = s && typeof s === 'object' ? s : {};
  return { habits: Array.isArray(s.habits) ? s.habits : [], checks: s.checks && typeof s.checks === 'object' ? s.checks : {} };
}

// ---------- dates (local time, not UTC) ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// ---------- base64 with UTF-8 support ----------
const b64enc = s => { let bin = ''; new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0)));

// ---------- GitHub API ----------
async function gh(method, url, body) {
  const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${url}`, {
    method,
    cache: 'no-store',
    keepalive: method !== 'GET',
    headers: {
      Authorization: `Bearer ${cfg.token}`,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(body ? { 'Content-Type': 'application/json' } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const info = await res.json().catch(() => ({}));
    const err = new Error(`${res.status} ${info.message || res.statusText}`);
    err.status = res.status;
    throw err;
  }
  return res.status === 204 ? null : res.json();
}

const fileUrl = () => `/contents/${cfg.path}?ref=${encodeURIComponent(cfg.branch)}`;

async function ensureBranch() {
  try {
    await gh('GET', `/branches/${encodeURIComponent(cfg.branch)}`);
  } catch (e) {
    if (e.status !== 404) throw e;
    const repo = await gh('GET', '');
    const base = await gh('GET', `/git/ref/heads/${encodeURIComponent(repo.default_branch)}`);
    await gh('POST', '/git/refs', { ref: `refs/heads/${cfg.branch}`, sha: base.object.sha });
  }
}

async function getFile() {
  try { return await gh('GET', fileUrl()); }
  catch (e) { if (e.status === 404) return null; throw e; }
}

async function pull() {
  if (!cfg.token) return;
  setStatus('Syncing…');
  try {
    await ensureBranch();
    const f = await getFile();
    sha = f ? f.sha : null;
    remoteReady = true;
    // First run (no file yet) or unsaved local changes: push local state up
    if (!f || isPending()) { await push(); return; }
    state = normalize(JSON.parse(b64dec(f.content)));
    store(CACHE_KEY, state);
    render();
    setStatus('Synced', 'ok');
  } catch (e) {
    setStatus('Sync failed: ' + e.message, 'err');
  }
}

async function push() {
  if (!remoteReady) return;
  if (saving) { dirty = true; return; }
  saving = true; dirty = false;
  setStatus('Saving…');
  const body = {
    message: `Update habits ${new Date().toISOString()}`,
    content: b64enc(JSON.stringify(state, null, 2)),
    branch: cfg.branch
  };
  if (sha) body.sha = sha;
  try {
    let r;
    try {
      r = await gh('PUT', `/contents/${cfg.path}`, body);
    } catch (e) {
      if (e.status !== 409 && e.status !== 422) throw e;
      // File changed elsewhere (stale sha): refresh sha and retry once. This device's state wins.
      const f = await getFile();
      if (f) body.sha = f.sha; else delete body.sha;
      r = await gh('PUT', `/contents/${cfg.path}`, body);
    }
    sha = r.content.sha;
    setPending(false);
    setStatus('Saved', 'ok');
  } catch (e) {
    setStatus('Save failed: ' + e.message, 'err');
  } finally {
    saving = false;
    if (dirty) schedule();
  }
}

function schedule() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; push(); }, 1200);
}

function commit() {
  store(CACHE_KEY, state);
  setPending(true);
  render();
  if (remoteReady) schedule(); else setStatus('Saved locally (not synced)', 'err');
}

function setStatus(text, kind = '') {
  const s = $('status');
  s.textContent = text;
  s.className = 'status ' + kind;
}

// ---------- habit logic ----------
function streak(id) {
  const c = state.checks[id] || {};
  let d = today();
  if (!c[ymd(d)]) d = addDays(d, -1); // today not done yet doesn't break the streak
  let n = 0;
  while (c[ymd(d)]) { n++; d = addDays(d, -1); }
  return n;
}

function render() {
  const end = addDays(today(), -endOffset);
  const days = Array.from({ length: 14 }, (_, i) => addDays(end, i - 13));
  const t = ymd(today());
  const short = d => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

  $('range').textContent = `${short(days[0])} – ${short(days[13])}`;
  $('next').disabled = endOffset === 0;
  $('todayBtn').disabled = endOffset === 0;

  const empty = state.habits.length === 0;
  $('empty').hidden = !empty;
  $('gridWrap').hidden = empty;
  if (empty) return;

  let html = '<thead><tr><th class="name">Habit</th>';
  for (const d of days) {
    html += `<th class="${ymd(d) === t ? 'today' : ''}">${d.toLocaleDateString(undefined, { weekday: 'short' })}<span class="dnum">${d.getDate()}</span></th>`;
  }
  html += '<th>Streak</th><th></th></tr></thead><tbody>';

  for (const h of state.habits) {
    const c = state.checks[h.id] || {};
    html += `<tr><td class="name" data-rename="${h.id}" title="Click to rename">${esc(h.name)}</td>`;
    for (const d of days) {
      const key = ymd(d), done = !!c[key];
      html += `<td class="${key === t ? 'today' : ''}"><button class="cell ${done ? 'done' : ''}" data-id="${h.id}" data-day="${key}" aria-label="${esc(h.name)} on ${key}">${done ? '✓' : ''}</button></td>`;
    }
    html += `<td class="streak">🔥 ${streak(h.id)}</td><td><button class="del" data-del="${h.id}" title="Delete habit">×</button></td></tr>`;
  }
  $('grid').innerHTML = html + '</tbody>';
}

// ---------- events ----------
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('habitName').value.trim();
  if (!name) return;
  const id = 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.habits.push({ id, name, createdAt: ymd(today()) });
  $('habitName').value = '';
  commit();
});

$('grid').addEventListener('click', e => {
  const cell = e.target.closest('[data-day]');
  if (cell) {
    const { id, day } = cell.dataset;
    const c = (state.checks[id] ||= {});
    if (c[day]) delete c[day]; else c[day] = true;
    return commit();
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    const h = state.habits.find(x => x.id === del.dataset.del);
    if (h && confirm(`Delete "${h.name}" and all its history?`)) {
      state.habits = state.habits.filter(x => x !== h);
      delete state.checks[h.id];
      commit();
    }
    return;
  }
  const ren = e.target.closest('[data-rename]');
  if (ren) {
    const h = state.habits.find(x => x.id === ren.dataset.rename);
    const name = h && prompt('Rename habit', h.name);
    if (name && name.trim()) { h.name = name.trim().slice(0, 60); commit(); }
  }
});

$('prev').onclick = () => { endOffset += 14; render(); };
$('next').onclick = () => { endOffset = Math.max(0, endOffset - 14); render(); };
$('todayBtn').onclick = () => { endOffset = 0; render(); };
$('status').onclick = () => { if (cfg.token && !saving) pull(); };

// Settings dialog
function openSettings() {
  const f = $('settingsForm');
  // Pre-fill owner/repo from the GitHub Pages URL when possible
  const host = location.hostname;
  const guessOwner = host.endsWith('.github.io') ? host.split('.')[0] : '';
  const guessRepo = guessOwner ? (location.pathname.split('/')[1] || host) : '';
  f.owner.value = cfg.owner || guessOwner;
  f.repo.value = cfg.repo || guessRepo;
  f.branch.value = cfg.branch || 'data';
  f.path.value = cfg.path || 'data.json';
  f.token.value = cfg.token || '';
  $('settings').showModal();
}
$('settingsBtn').onclick = openSettings;
$('settings').addEventListener('close', () => {
  if ($('settings').returnValue !== 'save') return;
  const f = $('settingsForm');
  cfg = {
    owner: f.owner.value.trim(),
    repo: f.repo.value.trim(),
    branch: f.branch.value.trim() || 'data',
    path: f.path.value.trim().replace(/^\/+/, '') || 'data.json',
    token: f.token.value.trim()
  };
  store(CFG_KEY, cfg);
  sha = null; remoteReady = false;
  pull();
});

// Flush pending save when the tab is hidden; re-sync when it comes back (keeps devices in step)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && saveTimer) {
    clearTimeout(saveTimer); saveTimer = null; push();
  } else if (document.visibilityState === 'visible') {
    render(); // date may have rolled over
    if (remoteReady && !saving && !saveTimer && !isPending()) pull();
  }
});

// ---------- start ----------
render();
if (cfg.token) pull();
else { setStatus('Not connected', 'err'); openSettings(); }
</script>
</body>
</html>
